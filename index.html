<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GamerWall | Premium Mağaza</title>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* YEPYENİ AYDINLIK (LIGHT) TEMA */
        :root {
            --bg-body: #f3f4f6;
            --bg-surface: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --primary: #2563eb; /* Canlı Mavi */
            --primary-hover: #1d4ed8;
            --danger: #ef4444;
            --success: #10b981;
            --border: #e5e7eb;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background-color: var(--bg-body); color: var(--text-main); overflow-x: hidden; }
        button { cursor: pointer; border: none; outline: none; background: none; color: inherit; }
        a { text-decoration: none; color: inherit; }

        /* ÜST MENÜ (BEMBEYAZ VE ŞIK) */
        header { background-color: var(--bg-surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 1000; box-shadow: var(--shadow); }
        .navbar { max-width: 1200px; margin: 0 auto; padding: 15px 24px; display: flex; align-items: center; justify-content: space-between; }
        .nav-left, .nav-right { display: flex; align-items: center; gap: 20px; }
        
        .hamburger-btn { font-size: 1.5rem; color: var(--text-main); transition: 0.2s; }
        .hamburger-btn:hover { color: var(--primary); }
        
        .logo { font-size: 1.6rem; font-weight: 700; color: var(--text-main); letter-spacing: -0.5px; }
        .logo span { color: var(--primary); }

        .search-bar { background: var(--bg-body); border: 1px solid var(--border); padding: 10px 20px; border-radius: 50px; display: flex; align-items: center; gap: 10px; width: 350px; }
        .search-bar input { background: none; border: none; outline: none; color: var(--text-main); width: 100%; font-size: 0.95rem; }

        .nav-right { position: relative; }
        .icon-btn { font-size: 1.4rem; position: relative; transition: 0.2s; color: var(--text-main); }
        .icon-btn:hover { color: var(--primary); }
        .cart-badge { position: absolute; top: -5px; right: -8px; background: var(--danger); color: white; font-size: 0.7rem; font-weight: 700; width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }

        /* PROFİL MENÜSÜ */
        .profile-dropdown { position: absolute; top: 50px; right: 50px; background: var(--bg-surface); border: 1px solid var(--border); border-radius: 12px; width: 200px; display: none; flex-direction: column; box-shadow: var(--shadow); z-index: 1001; overflow: hidden; }
        .profile-dropdown.open { display: flex; }
        .profile-dropdown a { padding: 15px; font-size: 0.9rem; border-bottom: 1px solid var(--border); transition: 0.2s; display: flex; align-items: center; gap: 10px; color: var(--text-main); }
        .profile-dropdown a:hover { background: var(--bg-body); color: var(--primary); }

        /* SAĞ SEPET (BEYAZ TEMA) */
        .cart-drawer { position: fixed; top: 0; right: -400px; width: 400px; max-width: 100vw; height: 100vh; background: var(--bg-surface); border-left: 1px solid var(--border); z-index: 2000; transition: 0.3s ease; display: flex; flex-direction: column; box-shadow: -5px 0 15px rgba(0,0,0,0.05); }
        .cart-drawer.open { right: 0; }
        .cart-header { padding: 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; font-size: 1.2rem; font-weight: 600; }
        .cart-items { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; background: var(--bg-body); padding: 15px; border-radius: 12px; border: 1px solid var(--border); }
        .cart-item-title { font-size: 0.95rem; font-weight: 600; margin-bottom: 5px; }
        .cart-item-price { color: var(--primary); font-weight: 700; }
        .remove-btn { color: var(--danger); font-size: 1.2rem; }
        .cart-footer { padding: 20px; border-top: 1px solid var(--border); background: var(--bg-surface); }
        .checkout-btn { width: 100%; background: var(--primary); color: white; padding: 15px; border-radius: 12px; font-size: 1.1rem; font-weight: 600; transition: 0.2s; box-shadow: 0 4px 6px rgba(37, 99, 235, 0.2); }
        .checkout-btn:hover { background: var(--primary-hover); transform: translateY(-2px); }

        /* GİRİŞ MODALI */
        .overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.4); backdrop-filter: blur(5px); z-index: 1500; display: none; opacity: 0; transition: 0.3s; }
        .overlay.active { display: block; opacity: 1; }
        .modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.9); background: var(--bg-surface); width: 400px; max-width: 90vw; border-radius: 16px; border: none; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); z-index: 2000; padding: 30px; display: none; opacity: 0; transition: 0.3s; }
        .modal.open { display: block; opacity: 1; transform: translate(-50%, -50%) scale(1); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; font-size: 1.4rem; font-weight: 700; color: var(--text-main); }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 0.9rem; color: var(--text-muted); margin-bottom: 8px; font-weight: 500; }
        .form-group input { width: 100%; background: var(--bg-body); border: 1px solid var(--border); color: var(--text-main); padding: 14px; border-radius: 10px; font-size: 1rem; outline: none; transition: 0.2s; }
        .form-group input:focus { border-color: var(--primary); background: #fff; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }
        .modal-btn { width: 100%; background: var(--text-main); color: white; padding: 14px; border-radius: 10px; font-weight: 600; font-size: 1.1rem; margin-top: 10px; transition: 0.2s; }
        .modal-btn:hover { background: #000; }

        /* ÜRÜN KARTLARI */
        main { max-width: 1200px; margin: 40px auto; padding: 0 24px; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px; }
        .product-card { background: var(--bg-surface); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; transition: 0.3s; display: flex; flex-direction: column; box-shadow: var(--shadow); }
        .product-card:hover { transform: translateY(-8px); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); border-color: var(--primary); }
        .product-img { width: 100%; height: 200px; object-fit: cover; }
        .product-info { padding: 20px; display: flex; flex-direction: column; flex: 1; }
        .product-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 8px; color: var(--text-main); }
        .product-meta { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 20px; }
        .product-bottom { display: flex; justify-content: space-between; align-items: center; margin-top: auto; }
        .price { font-size: 1.3rem; font-weight: 700; color: var(--primary); }
        .add-btn { background: var(--bg-body); color: var(--primary); padding: 10px 20px; border-radius: 10px; font-weight: 600; transition: 0.2s; border: 1px solid var(--border); }
        .add-btn:hover { background: var(--primary); color: white; border-color: var(--primary); }

        /* TOAST BİLDİRİMİ */
        #toast-container { position: fixed; bottom: 30px; right: 30px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
        .toast { background: var(--text-main); color: white; width: 350px; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.2); pointer-events: auto; animation: slideIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .toast-content { padding: 18px; display: flex; justify-content: space-between; align-items: center; }
        .toast-text { display: flex; align-items: center; gap: 12px; font-size: 0.95rem; font-weight: 500; }
        .toast-close { color: #9ca3af; cursor: pointer; font-size: 1.3rem; transition: 0.2s; }
        .toast-close:hover { color: white; }
        .toast-progress { width: 100%; height: 4px; background: #374151; }
        .toast-bar { height: 100%; background: var(--success); width: 100%; animation: shrink 3s linear forwards; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes shrink { from { width: 100%; } to { width: 0%; } }
    </style>
</head>
<body>

    <div class="overlay" id="overlay" onclick="closeAll()"></div>

    <!-- YENİ BEYAZ HEADER -->
    <header>
        <div class="navbar">
            <div class="nav-left">
                <a href="#" class="logo">Gamer<span>Wall</span></a>
            </div>
            
            <div class="search-bar">
                <i class="fa-solid fa-magnifying-glass" style="color: var(--text-muted);"></i>
                <input type="text" placeholder="Duvar kağıdı ara...">
            </div>

            <div class="nav-right">
                <button class="icon-btn" onclick="handleProfileClick()" title="Hesabım">
                    <i class="fa-regular fa-user"></i>
                </button>
                
                <div class="profile-dropdown" id="profile-dropdown">
                    <a href="#"><i class="fa-solid fa-user-circle"></i> Profilim</a>
                    <a href="#"><i class="fa-solid fa-box-open"></i> Siparişlerim</a>
                    <a href="#" onclick="logout()" style="color: var(--danger);"><i class="fa-solid fa-right-from-bracket"></i> Çıkış Yap</a>
                </div>

                <button class="icon-btn" onclick="toggleCart()" title="Sepetim">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span class="cart-badge" id="cart-count">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- SAĞ SEPET -->
    <div class="cart-drawer" id="cart-drawer">
        <div class="cart-header">
            <span>Alışveriş Sepeti</span>
            <button onclick="toggleCart()" style="font-size: 1.5rem;"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="cart-items" id="cart-items">
            <div style="text-align: center; color: var(--text-muted); margin-top: 50px;">Sepetiniz şu an boş.</div>
        </div>
        <div class="cart-footer">
            <div style="display: flex; justify-content: space-between; margin-bottom: 20px; font-size: 1.3rem; font-weight: 700;">
                <span>Toplam:</span>
                <span id="cart-total" style="color: var(--primary);">0.00 ₺</span>
            </div>
            <button class="checkout-btn" onclick="checkout()">Güvenli Ödeme Yap</button>
        </div>
    </div>

    <!-- GİRİŞ MODALI -->
    <div class="modal" id="login-modal">
        <div class="modal-header">
            <span>Hoş Geldiniz</span>
            <button onclick="closeAll()" style="font-size: 1.5rem;"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="form-group">
            <label>E-posta Adresiniz</label>
            <input type="email" placeholder="ornek@mail.com">
        </div>
        <div class="form-group">
            <label>Şifreniz</label>
            <input type="password" placeholder="••••••••">
        </div>
        <button class="modal-btn" onclick="login()">Giriş Yap</button>
    </div>

    <div id="toast-container"></div>

    <!-- ÜRÜNLER (AYDINLIK TEMA) -->
    <main>
        <div class="product-grid">
            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1547394765-185e1e68f34e?q=80&w=600" class="product-img">
                <div class="product-info">
                    <h3 class="product-title">CS2 Dust 2 Pro Edition</h3>
                    <span class="product-meta">4K Ultra HD • PNG Format</span>
                    <div class="product-bottom">
                        <span class="price">39.99 ₺</span>
                        <button class="add-btn" onclick="addToCart('CS2 Dust 2 Pro', 39.99)">Sepete Ekle</button>
                    </div>
                </div>
            </div>

            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1511512578047-dfb367046420?q=80&w=600" class="product-img">
                <div class="product-info">
                    <h3 class="product-title">MSI 180Hz Neon Tema</h3>
                    <span class="product-meta">Canlı (Live) • MP4 Format</span>
                    <div class="product-bottom">
                        <span class="price">49.99 ₺</span>
                        <button class="add-btn" onclick="addToCart('MSI Neon Tema', 49.99)">Sepete Ekle</button>
                    </div>
                </div>
            </div>
            
            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1614315585042-371286395dc6?q=80&w=600" class="product-img">
                <div class="product-info">
                    <h3 class="product-title">Kırmızı Donanım Setup</h3>
                    <span class="product-meta">8K Çözünürlük • JPG Format</span>
                    <div class="product-bottom">
                        <span class="price">29.99 ₺</span>
                        <button class="add-btn" onclick="addToCart('Kırmızı Setup', 29.99)">Sepete Ekle</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- BASİTLEŞTİRİLMİŞ, %100 ÇALIŞAN JAVASCRIPT -->
    <script>
        let isLoggedIn = false;
        let cart = [];

        function getEl(id) { return document.getElementById(id); }

        function toggleCart() {
            getEl('cart-drawer').classList.toggle('open');
            getEl('overlay').classList.toggle('active');
            getEl('profile-dropdown').classList.remove('open');
        }

        function handleProfileClick() {
            if (!isLoggedIn) {
                getEl('login-modal').classList.add('open');
                getEl('overlay').classList.add('active');
                getEl('cart-drawer').classList.remove('open');
            } else {
                getEl('profile-dropdown').classList.toggle('open');
            }
        }

        function closeAll() {
            getEl('cart-drawer').classList.remove('open');
            getEl('login-modal').classList.remove('open');
            getEl('profile-dropdown').classList.remove('open');
            getEl('overlay').classList.remove('active');
        }

        function login() {
            isLoggedIn = true;
            closeAll();
            showToast("Sisteme başarıyla giriş yapıldı!");
        }

        function logout() {
            isLoggedIn = false;
            closeAll();
            showToast("Hesabınızdan çıkış yapıldı.");
        }

        function addToCart(title, price) {
            if (!isLoggedIn) {
                handleProfileClick();
                return;
            }
            cart.push({ id: Date.now(), title: title, price: price });
            updateCartUI();
            showToast("<b>" + title + "</b> sepete eklendi!");
        }

        function removeFromCart(id) {
            cart = cart.filter(function(item) { return item.id !== id; });
            updateCartUI();
        }

        function updateCartUI() {
            getEl('cart-count').innerText = cart.length;
            const container = getEl('cart-items');
            
            if (cart.length === 0) {
                container.innerHTML = '<div style="text-align: center; color: var(--text-muted); margin-top: 50px;">Sepetiniz şu an boş.</div>';
                getEl('cart-total').innerText = "0.00 ₺";
                return;
            }

            let html = '';
            let total = 0;
            for(let i=0; i<cart.length; i++) {
                let item = cart[i];
                total += item.price;
                html += '<div class="cart-item">' +
                            '<div>' +
                                '<div class="cart-item-title">' + item.title + '</div>' +
                                '<div class="cart-item-price">' + item.price.toFixed(2) + ' ₺</div>' +
                            '</div>' +
                            '<button class="remove-btn" onclick="removeFromCart(' + item.id + ')"><i class="fa-solid fa-trash"></i></button>' +
                        '</div>';
            }
            
            container.innerHTML = html;
            getEl('cart-total').innerText = total.toFixed(2) + " ₺";
        }

        function showToast(message) {
            const container = getEl('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = 
                '<div class="toast-content">' +
                    '<div class="toast-text"><i class="fa-solid fa-circle-check" style="color: var(--success); font-size: 1.3rem;"></i>' + message + '</div>' +
                    '<i class="fa-solid fa-xmark toast-close" onclick="this.parentElement.parentElement.remove()"></i>' +
                '</div>' +
                '<div class="toast-progress"><div class="toast-bar"></div></div>';
            
            container.appendChild(toast);
            setTimeout(function() { if (toast.parentElement) toast.remove(); }, 3000);
        }

        function checkout() {
            if(cart.length === 0) {
                alert("Önce sepetinize ürün eklemelisiniz.");
            } else {
                alert("Ödeme sayfasına yönlendiriliyorsunuz...");
            }
        }
    </script>
</body>
</html>
